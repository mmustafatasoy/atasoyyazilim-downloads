name: EYMEN Store katalog
on:
  push:
    branches: [store-feed]
    paths:
      - 'store/apps.json'
      - 'store/scan.py'
      - 'store/icons/**'
      - 'store/shots/**'
      - '.github/workflows/store-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-feed
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: store-feed
      - run: pip install --quiet pillow
      - name: Yayınları tara
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 store/scan.py 2>&1 | tee store/scan-report.txt
      - name: Kataloğu kaydet
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add store
          git diff --cached --quiet || { git commit -m "store: katalog güncellendi"; git push origin HEAD:store-feed; }
