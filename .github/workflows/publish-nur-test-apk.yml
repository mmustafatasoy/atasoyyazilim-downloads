name: Build & publish NUR Quran 0.9.0 test APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nur-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nur-quran-v0-9-test-release
  cancel-in-progress: false

jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public NUR application source
        uses: actions/checkout@v4
        with:
          repository: mmustafatasoy/kuranikerim
          ref: a802b53cc623d3a95d0dc52c7af328e1f56d0124
          path: nur-source
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" "platforms;android-36"

      - name: Verify source version and content
        working-directory: nur-source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.9.0"' app/build.gradle.kts
          grep -q 'applicationId = "com.nur.quran"' app/build.gradle.kts
          python3 scripts/validate_data.py
          python3 scripts/check_quranenc_meal.py

      - name: Build Android test APK
        working-directory: nur-source
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify the APK and integrity
        run: |
          set -euo pipefail
          mkdir -p publication
          APK="nur-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" publication/NUR-Quran-v0.9.0-TEST.apk
          (cd publication && sha256sum NUR-Quran-v0.9.0-TEST.apk > SHA256SUMS.txt)
          unzip -t publication/NUR-Quran-v0.9.0-TEST.apk | tail -n 1
          COUNT="$(unzip -Z1 "$APK" | grep -Ec '^assets/quran_audio/alafasy/[0-9]+\.mp3$')"
          test "$COUNT" -eq 22
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.nur.quran' .*versionName='0.9.0'"

      - name: Publish TEST ONLY GitHub Release
        env:
          GH_TOKEN: \${{ github.token }}
          REPOSITORY: \${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="nur-v0.9.0-test"
          NOTES="NUR Quran Android 0.9.0 - TEST / DEBUG APK only.

          This APK was built from the public official NUR repository, pinned to commit a802b53cc623d3a95d0dc52c7af328e1f56d0124.
          WARNING: Debug signing key is generated by CI and is not suitable for production app updates.
          Do not treat this as a stable signed production release. Installing a future production APK may require uninstalling the debug app and may erase stored user data.
          Android 8.0+; Turkish UI; SHA256SUMS.txt accompanies the file.
          Please verify copyright/licensing obligations for bundled fonts, translation, and recitation audio prior to widespread distribution."
          if gh release view "$TAG" -R "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" publication/NUR-Quran-v0.9.0-TEST.apk publication/SHA256SUMS.txt --clobber -R "$REPOSITORY"
          else
            gh release create "$TAG" publication/NUR-Quran-v0.9.0-TEST.apk publication/SHA256SUMS.txt \
              --title "NUR Quran v0.9.0 — TEST APK (not production signed)" \
              --notes "$NOTES" \
              --prerelease \
              -R "$REPOSITORY"
          fi
