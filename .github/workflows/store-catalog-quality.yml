name: ATASOY STORE catalog validation
on:
  push:
    branches: [main]
    paths:
      - "store/catalog.json"
      - "store/media-index.json"
      - "scripts/check-store-catalog.py"
      - ".github/workflows/store-catalog-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-store-catalog.py
